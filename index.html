<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mia Murphy - Portfolio</title>
  <meta name="description" content="Finance × Data Professional - Portfolio"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #0a0a12;               /* Deep night sky */
      --bg-mid: #12121f;           /* Slightly lighter midnight */
      --text: #f0eef5;             /* Soft white text */
      --muted: #b8b0cc;            /* Lavender muted */
      --lavender: #c9b8e8;         /* Primary lavender */
      --lavender-soft: #e0d4f5;    /* Soft lavender */
      --aurora-pink: #f4b8c5;      /* Pastel pink */
      --aurora-blue: #a8c8e8;      /* Pastel blue */
      --aurora-violet: #d4a8e8;    /* Soft violet */
      --firefly: #f5e6a3;          /* Warm firefly glow */
      --firefly-soft: #fff8dc;     /* Soft firefly */
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{
      font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
      background: 
        radial-gradient(ellipse 120% 80% at 20% 0%, rgba(201,184,232,.08), transparent 50%),
        radial-gradient(ellipse 100% 60% at 80% 10%, rgba(168,200,232,.06), transparent 50%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(244,184,197,.05), transparent 50%),
        linear-gradient(180deg, #0d0d18 0%, var(--bg) 40%, #0e0e1a 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Aurora Northern Lights Effect */
    .aurora {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      opacity: 0.5;
    }
    .aurora-wave {
      position: absolute;
      width: 200%;
      height: 60%;
      top: -20%;
      left: -50%;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(201,184,232,.03) 20%,
        rgba(168,200,232,.05) 40%,
        rgba(244,184,197,.04) 60%,
        rgba(212,168,232,.03) 80%,
        transparent 100%
      );
      animation: auroraFlow 20s ease-in-out infinite;
      filter: blur(40px);
    }
    .aurora-wave:nth-child(2) {
      animation-delay: -7s;
      animation-duration: 25s;
      opacity: 0.7;
    }
    .aurora-wave:nth-child(3) {
      animation-delay: -14s;
      animation-duration: 30s;
      opacity: 0.5;
    }
    @keyframes auroraFlow {
      0%, 100% { 
        transform: translateX(-10%) rotate(-3deg) scaleY(1);
      }
      33% { 
        transform: translateX(5%) rotate(2deg) scaleY(1.1);
      }
      66% { 
        transform: translateX(-5%) rotate(-1deg) scaleY(0.9);
      }
    }

    /* Fireflies */
    .fireflies {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }
    .firefly {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--firefly);
      border-radius: 50%;
      box-shadow: 
        0 0 6px 2px var(--firefly),
        0 0 12px 4px rgba(245,230,163,.4),
        0 0 20px 6px rgba(245,230,163,.2);
      animation: fireflyFloat 12s ease-in-out infinite, fireflyGlow 3s ease-in-out infinite;
      opacity: 0;
    }
    @keyframes fireflyFloat {
      0% {
        transform: translate(0, 0) scale(0.8);
      }
      25% {
        transform: translate(30px, -40px) scale(1);
      }
      50% {
        transform: translate(-20px, -80px) scale(0.9);
      }
      75% {
        transform: translate(40px, -120px) scale(1.1);
      }
      100% {
        transform: translate(10px, -160px) scale(0.8);
      }
    }
    @keyframes fireflyGlow {
      0%, 100% { 
        opacity: 0;
      }
      15%, 85% {
        opacity: 0.9;
      }
      50% { 
        opacity: 0.4;
      }
    }

    /* Distant Stars */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(240,238,245,.6);
      border-radius: 50%;
      animation: starTwinkle 4s ease-in-out infinite;
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }

    /* Main Container */
    .container {
      text-align: center;
      z-index: 10;
      position: relative;
    }

    /* Elegant Glowing Orb Loader */
    .loading-container {
      margin-bottom: 48px;
    }
    .orb-loader {
      width: 100px;
      height: 100px;
      margin: 0 auto 32px;
      position: relative;
    }
    .orb {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: radial-gradient(circle at 30% 30%, var(--lavender-soft), var(--lavender));
      border-radius: 50%;
      box-shadow: 
        0 0 20px var(--lavender),
        0 0 40px rgba(201,184,232,.4),
        0 0 60px rgba(201,184,232,.2);
      animation: orbPulse 3s ease-in-out infinite;
    }
    .orb-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid;
      animation: ringExpand 3s ease-out infinite;
    }
    .orb-ring:nth-child(2) {
      border-color: var(--lavender);
      animation-delay: 0s;
    }
    .orb-ring:nth-child(3) {
      border-color: var(--aurora-pink);
      animation-delay: 0.5s;
    }
    .orb-ring:nth-child(4) {
      border-color: var(--aurora-blue);
      animation-delay: 1s;
    }
    @keyframes orbPulse {
      0%, 100% { 
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 
          0 0 20px var(--lavender),
          0 0 40px rgba(201,184,232,.4);
      }
      50% { 
        transform: translate(-50%, -50%) scale(1.1);
        box-shadow: 
          0 0 30px var(--lavender),
          0 0 60px rgba(201,184,232,.5),
          0 0 80px rgba(244,184,197,.2);
      }
    }
    @keyframes ringExpand {
      0% {
        width: 40px;
        height: 40px;
        opacity: 0.8;
      }
      100% {
        width: 100px;
        height: 100px;
        opacity: 0;
      }
    }

    /* Title */
    .title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(52px, 9vw, 108px);
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      background: linear-gradient(
        135deg, 
        var(--aurora-blue) 0%, 
        var(--lavender-soft) 25%,
        var(--aurora-pink) 50%,
        var(--lavender) 75%,
        var(--aurora-blue) 100%
      );
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleShimmer 8s ease-in-out infinite;
      text-shadow: 0 0 60px rgba(201,184,232,.3);
    }
    @keyframes titleShimmer {
      0%, 100% { 
        background-position: 0% 50%;
        filter: drop-shadow(0 0 20px rgba(201,184,232,.2));
      }
      50% { 
        background-position: 100% 50%;
        filter: drop-shadow(0 0 30px rgba(244,184,197,.25));
      }
    }

    .subtitle {
      font-family: 'Quicksand', sans-serif;
      font-size: clamp(16px, 2.5vw, 24px);
      color: var(--muted);
      margin-bottom: 48px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      animation: fadeInUp 1.2s ease-out 0.3s both;
    }

    /* Loading Text */
    .loading-text {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 300;
      opacity: 1;
      transition: opacity 0.8s ease-out;
    }
    .loading-text.hidden {
      opacity: 0;
    }
    .loading-dots {
      display: inline-block;
      width: 24px;
      text-align: left;
    }

    /* Moon Phases Loading Bar */
    .moon-phases {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 0 auto 24px;
      opacity: 1;
      transition: opacity 0.8s ease-out;
    }
    .moon-phases.hidden {
      opacity: 0;
    }
    .moon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      position: relative;
      opacity: 0.3;
      transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
      transform: scale(0.85);
      background: radial-gradient(circle at 40% 40%, #fff, var(--lavender-soft) 40%, var(--lavender) 100%);
      overflow: hidden;
    }
    .moon.active {
      opacity: 1;
      transform: scale(1);
    }
    .moon::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: var(--bg);
    }
    
    /* New Moon - fully dark */
    .moon-new {
      background: var(--bg);
      border: 1px solid rgba(201,184,232,.25);
      box-shadow: inset 0 0 6px rgba(0,0,0,.6);
    }
    .moon-new::after {
      display: none;
    }
    .moon-new.active {
      border-color: rgba(201,184,232,.5);
      box-shadow: inset 0 0 6px rgba(0,0,0,.6), 0 0 12px rgba(201,184,232,.15);
    }
    
    /* Waxing Crescent - small sliver on right */
    .moon-waxing-crescent::after {
      width: 22px;
      height: 22px;
      top: 0;
      left: -11px;
    }
    .moon-waxing-crescent.active {
      box-shadow: 2px 0 10px rgba(224,212,245,.4);
    }
    
    /* First Quarter - right half lit */
    .moon-first-quarter::after {
      width: 11px;
      height: 22px;
      top: 0;
      left: 0;
      border-radius: 11px 0 0 11px;
    }
    .moon-first-quarter.active {
      box-shadow: 3px 0 12px rgba(224,212,245,.45);
    }
    
    /* Waxing Gibbous - mostly lit, shadow on left */
    .moon-waxing-gibbous::after {
      width: 14px;
      height: 22px;
      top: 0;
      left: -7px;
      border-radius: 50%;
    }
    .moon-waxing-gibbous.active {
      box-shadow: 0 0 14px rgba(224,212,245,.5);
    }
    
    /* Full Moon - fully lit */
    .moon-full::after {
      display: none;
    }
    .moon-full.active {
      box-shadow: 
        0 0 15px rgba(224,212,245,.6),
        0 0 30px rgba(201,184,232,.4),
        0 0 45px rgba(201,184,232,.2);
    }
    
    /* Waning Gibbous - mostly lit, shadow on right */
    .moon-waning-gibbous::after {
      width: 14px;
      height: 22px;
      top: 0;
      right: -7px;
      left: auto;
      border-radius: 50%;
    }
    .moon-waning-gibbous.active {
      box-shadow: 0 0 14px rgba(224,212,245,.5);
    }
    
    /* Last Quarter - left half lit */
    .moon-last-quarter::after {
      width: 11px;
      height: 22px;
      top: 0;
      right: 0;
      left: auto;
      border-radius: 0 11px 11px 0;
    }
    .moon-last-quarter.active {
      box-shadow: -3px 0 12px rgba(224,212,245,.45);
    }
    
    /* Waning Crescent - small sliver on left */
    .moon-waning-crescent::after {
      width: 22px;
      height: 22px;
      top: 0;
      right: -11px;
      left: auto;
    }
    .moon-waning-crescent.active {
      box-shadow: -2px 0 10px rgba(224,212,245,.4);
    }

    /* Progress Bar (subtle line below moons) */
    .progress-container {
      width: 280px;
      height: 2px;
      background: rgba(201,184,232,.15);
      border-radius: 1px;
      margin: 0 auto 48px;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.8s ease-out;
    }
    .progress-container.hidden {
      opacity: 0;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(
        90deg, 
        var(--aurora-blue),
        var(--lavender),
        var(--aurora-pink)
      );
      background-size: 200% 100%;
      border-radius: 1px;
      animation: progressFill 3s ease-out forwards, progressShimmer 2s ease-in-out infinite;
    }
    @keyframes progressFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @keyframes progressShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Welcome Message (appears after loading) */
    .welcome-text {
      font-size: 14px;
      color: var(--lavender);
      margin-bottom: 32px;
      letter-spacing: 0.15em;
      font-weight: 400;
      opacity: 0;
      transition: opacity 0.8s ease-out;
    }
    .welcome-text.visible {
      opacity: 1;
    }

    /* Enter Button */
    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 18px 40px;
      background: transparent;
      border: 1px solid rgba(201,184,232,.4);
      border-radius: 50px;
      color: var(--lavender-soft);
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease-out 3.5s both;
      position: relative;
      overflow: hidden;
    }
    .enter-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg,
        rgba(168,200,232,.1),
        rgba(201,184,232,.15),
        rgba(244,184,197,.1)
      );
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .enter-btn:hover {
      border-color: var(--lavender);
      box-shadow: 
        0 0 30px rgba(201,184,232,.2),
        0 0 60px rgba(201,184,232,.1),
        inset 0 0 30px rgba(201,184,232,.05);
      transform: translateY(-2px);
    }
    .enter-btn:hover::before {
      opacity: 1;
    }
    .enter-btn span {
      position: relative;
      z-index: 1;
    }
    .enter-btn .arrow {
      transition: transform 0.3s ease;
      font-size: 16px;
    }
    .enter-btn:hover .arrow {
      transform: translateX(4px);
    }

    /* Fade In Animation */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Elegant Decorative Elements */
    .decorative-line {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--lavender), transparent);
      margin: 0 auto 32px;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.5s both;
    }
    @keyframes fadeIn {
      to { opacity: 0.6; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .progress-container {
        width: 220px;
      }
      .enter-btn {
        padding: 16px 32px;
        font-size: 12px;
      }
      .orb-loader {
        width: 80px;
        height: 80px;
      }
      .orb {
        width: 32px;
        height: 32px;
      }
      @keyframes ringExpand {
        0% {
          width: 32px;
          height: 32px;
          opacity: 0.8;
        }
        100% {
          width: 80px;
          height: 80px;
          opacity: 0;
        }
      }
    }
  </style>
</head>
<body>
  <!-- Aurora Effect -->
  <div class="aurora">
    <div class="aurora-wave"></div>
    <div class="aurora-wave"></div>
    <div class="aurora-wave"></div>
  </div>

  <!-- Distant Stars -->
  <div class="stars" id="stars"></div>

  <!-- Fireflies -->
  <div class="fireflies" id="fireflies"></div>

  <!-- Main Content -->
  <div class="container">
    <div class="loading-container">
      <div class="orb-loader">
        <div class="orb"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
      </div>
      <h1 class="title">Mia Murphy</h1>
      <div class="decorative-line"></div>
      <p class="subtitle">Finance × Data Professional</p>
    </div>

    <div class="loading-text" id="loadingText">
      Loading<span class="loading-dots" id="loadingDots"></span>
    </div>

    <div class="moon-phases" id="moonPhases">
      <div class="moon moon-new" data-phase="0"></div>
      <div class="moon moon-waxing-crescent" data-phase="1"></div>
      <div class="moon moon-first-quarter" data-phase="2"></div>
      <div class="moon moon-waxing-gibbous" data-phase="3"></div>
      <div class="moon moon-full" data-phase="4"></div>
      <div class="moon moon-waning-gibbous" data-phase="5"></div>
      <div class="moon moon-last-quarter" data-phase="6"></div>
      <div class="moon moon-waning-crescent" data-phase="7"></div>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar"></div>
    </div>

    <div class="welcome-text" id="welcomeText">
      Welcome to my portfolio
    </div>

    <a href="https://nightskyfirefly.vercel.app/" class="enter-btn">
      <span>Enter</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <script>
    // Create distant stars
    function createStars() {
      const starsContainer = document.getElementById('stars');
      const starCount = 80;

      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 4 + 's';
        star.style.animationDuration = (Math.random() * 3 + 3) + 's';
        
        // Vary star sizes slightly
        const size = Math.random() * 1.5 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        
        starsContainer.appendChild(star);
      }
    }

    // Create fireflies
    function createFireflies() {
      const firefliesContainer = document.getElementById('fireflies');
      const fireflyCount = 25;

      for (let i = 0; i < fireflyCount; i++) {
        const firefly = document.createElement('div');
        firefly.className = 'firefly';
        
        // Random positioning across the screen
        firefly.style.left = Math.random() * 100 + '%';
        firefly.style.top = (Math.random() * 60 + 40) + '%'; // Bottom 60% of screen
        
        // Varied animation timing for natural effect
        const floatDuration = Math.random() * 8 + 10;
        const glowDuration = Math.random() * 2 + 2;
        const floatDelay = Math.random() * 10;
        const glowDelay = Math.random() * 3;
        
        firefly.style.animationDuration = floatDuration + 's, ' + glowDuration + 's';
        firefly.style.animationDelay = floatDelay + 's, ' + glowDelay + 's';
        
        // Vary firefly sizes
        const size = Math.random() * 2 + 3;
        firefly.style.width = size + 'px';
        firefly.style.height = size + 'px';
        
        firefliesContainer.appendChild(firefly);
      }
    }

    // Animate loading dots and moon phases
    function animateLoadingDots() {
      const dotsElement = document.getElementById('loadingDots');
      const loadingText = document.getElementById('loadingText');
      const progressContainer = document.getElementById('progressContainer');
      const moonPhases = document.getElementById('moonPhases');
      const welcomeText = document.getElementById('welcomeText');
      const moons = document.querySelectorAll('.moon');
      
      let dotCount = 0;
      const dots = ['', '.', '..', '...'];
      
      // Animate loading dots
      const dotsInterval = setInterval(() => {
        dotCount = (dotCount + 1) % dots.length;
        dotsElement.textContent = dots[dotCount];
      }, 400);
      
      // Animate moon phases sequentially
      let currentPhase = 0;
      const phaseInterval = setInterval(() => {
        if (currentPhase < moons.length) {
          moons[currentPhase].classList.add('active');
          currentPhase++;
        }
        if (currentPhase >= moons.length) {
          clearInterval(phaseInterval);
        }
      }, 375); // 3000ms / 8 phases = 375ms per phase
      
      // Stop loading animation after 3 seconds
      setTimeout(() => {
        clearInterval(dotsInterval);
        clearInterval(phaseInterval);
        loadingText.classList.add('hidden');
        progressContainer.classList.add('hidden');
        
        // Instead of hiding, trigger unique completion effect
        // moonPhases.classList.add('hidden'); 
        moonPhases.classList.add('loading-complete');
        
        // Show welcome message
        setTimeout(() => {
          welcomeText.classList.add('visible');
        }, 400);
      }, 3200);
    }

    // Subtle mouse interaction - gentle glow follows cursor
    function initMouseInteraction() {
      let glowElement = null;
      
      document.addEventListener('mousemove', function(e) {
        if (!glowElement) {
          glowElement = document.createElement('div');
          glowElement.style.cssText = `
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(201,184,232,.03) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            transition: transform 0.3s ease-out;
          `;
          document.body.appendChild(glowElement);
        }
        
        glowElement.style.left = (e.clientX - 150) + 'px';
        glowElement.style.top = (e.clientY - 150) + 'px';
      });
    }

    // Initialize everything when page loads
    document.addEventListener('DOMContentLoaded', function() {
      createStars();
      createFireflies();
      animateLoadingDots();
      initMouseInteraction();
    });
  </script>
</body>
</html>
